<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HyperFrames</title>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #0d0f14;
        color: #eef2f7;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.18);
        border-top-color: #7d9fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      p {
        margin-top: 18px;
        color: #8b95a7;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div style="text-align: center">
      <div class="spinner"></div>
      <p>Starting HyperFrames…</p>
    </div>
  </body>
</html>
